<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Escape del Aula</title>
</head>
<body>
    <h1>Iniciar sesión</h1>
    
    <!-- ACÁ MOSTRAMOS EL ERROR SI LA CONTRASEÑA O EL USUARIO ESTÁN MAL -->
    {% if error %}
        <p style="color: red; font-weight: bold;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label>Usuario:</label>
        <input type="text" name="username" required>
        <br><br>
        <label>Contraseña:</label>
        <input type="password" name="password" required>
        <br><br>
        <button type="submit">Entrar</button>
    </form>

    <br>
    <a href="/registrar/">¿No tenés cuenta? Registrate acá</a>
    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
